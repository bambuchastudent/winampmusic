# Ámpula short-link relay — Cloudflare Worker configuration.
#
# STATUS: NOT DEPLOYED. See README.md.
# `APP_ORIGIN` and `kv_namespaces.id` are placeholders and must be set by an operator.

name = "ampula-short-link"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
APP_ORIGIN = "https://bambuchastudent.github.io/winampmusic/"

# Ephemeral salt for the truncated rate-limit bucket. Override per deployment.
RATE_SALT = "replace-me"

# Create with: wrangler kv namespace create AMPULA_LINKS
[[kv_namespaces]]
binding = "AMPULA_LINKS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
