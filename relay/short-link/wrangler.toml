# Ámpula short-link relay — Cloudflare Worker configuration.
#
# Account-specific resource identifiers and private salts deliberately do not
# live in this file. Wrangler v4 provisions the KV binding for the target
# account, while RATE_SALT is supplied as a Worker secret by production CI.

name = "ampula-short-link"
main = "worker.js"
compatibility_date = "2026-08-26"

[vars]
# Full application URL, including the path. Used as the browser redirect target.
# The CORS allow-origin header is derived from this as new URL(APP_URL).origin,
# because a browser Origin never carries a path.
APP_URL = "https://bambuchastudent.github.io/winampmusic/"

# Ámpula payload storage. Wrangler >= 4.45 automatically provisions and links
# this KV namespace when no account-specific id is present.
[[kv_namespaces]]
binding = "AMPULA_LINKS"

# Rate limiting. A Durable Object is used instead of a KV counter because KV is
# eventually consistent and has no compare-and-set, so it cannot enforce a limit
# under concurrency. The limiter holds a counter only and never sees a payload.
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "ShortLinkRateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ShortLinkRateLimiter"]
