<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ámpula Viewer</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; background: #111; color: #f5f5f5; display: grid; place-items: center; }
    main { width: min(760px, calc(100vw - 32px)); padding: 28px 0 48px; }
    .drop { border: 1px dashed #666; border-radius: 18px; padding: 32px; text-align: center; background: #191919; }
    input[type=file] { margin-top: 14px; }
    #memory[hidden] { display: none; }
    #memory { margin-top: 22px; padding: 22px; border: 1px solid #333; border-radius: 18px; background: #181818; }
    h1, h2, p { margin-top: 0; }
    .meta { color: #aaa; font-size: .92rem; }
    ol { padding-left: 26px; }
    li { padding: 10px 0; }
    .artist { color: #bbb; }
    .trace { font-size: .85rem; color: #888; margin-top: 4px; }
    .cue { font-size: .85rem; color: #aaa; }
    .error { color: #ff9b9b; margin-top: 14px; white-space: pre-wrap; }
    button { border: 1px solid #555; border-radius: 12px; background: #222; color: #fff; padding: 9px 12px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <section class="drop" id="dropZone">
      <h1>Ámpula</h1>
      <p>Передаваемая память о моменте через музыку.</p>
      <p class="meta">Файл читается локально в браузере. Никуда не загружается.</p>
      <input id="fileInput" type="file" accept=".ampula,application/json,application/vnd.ampula+json" />
      <div id="error" class="error"></div>
    </section>

    <section id="memory" hidden>
      <p class="meta" id="capturedAt"></p>
      <h2 id="title"></h2>
      <p id="note"></p>
      <ol id="tracks"></ol>
      <button id="openAnother" type="button">Открыть другую Ámpula</button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
