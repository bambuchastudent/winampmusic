<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#17191f" />
  <title>Refreshing Winamp Music controls…</title>
  <style>
    html,body{height:100%;margin:0;background:#101216;color:#f6f6f6;font:16px system-ui,-apple-system,sans-serif}
    body{display:grid;place-items:center}.box{max-width:560px;padding:28px;text-align:center}.bolt{font-size:56px}.muted{color:#aeb4c0;line-height:1.45}button{font:inherit;padding:11px 18px;border-radius:10px;border:0;font-weight:800;cursor:pointer}
  </style>
</head>
<body>
  <div class="box">
    <div class="bolt">⚡</div>
    <h1>Fixing player controls</h1>
    <p id="state" class="muted">Installing Winamp Music native controls 1.3.9. Your saved library stays intact.</p>
    <button id="retry" hidden>Open player</button>
  </div>
  <script>
    (async () => {
      const state = document.getElementById('state');
      const retry = document.getElementById('retry');
      const openPlayer = () => location.replace('./?runtime=139&t=' + Date.now());
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.filter((reg) => reg.scope.includes('/winampmusic/')).map((reg) => reg.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.filter((key) => key.startsWith('winampmusic-shell-')).map((key) => caches.delete(key)));
        }

        state.textContent = 'Installing native control runtime…';
        if ('serviceWorker' in navigator) {
          const reg = await navigator.serviceWorker.register('./sw.js?runtime=139&t=' + Date.now(), {
            scope: './',
            updateViaCache: 'none'
          });
          try { await reg.update(); } catch {}
          const worker = reg.installing || reg.waiting || reg.active;
          if (worker && worker.state !== 'activated') {
            await new Promise((resolve) => {
              const timeout = setTimeout(resolve, 10000);
              worker.addEventListener('statechange', () => {
                if (worker.state === 'activated' || worker.state === 'redundant') {
                  clearTimeout(timeout);
                  resolve();
                }
              });
            });
          }
          await new Promise((resolve) => {
            if (navigator.serviceWorker.controller) return resolve();
            const timeout = setTimeout(resolve, 3000);
            navigator.serviceWorker.addEventListener('controllerchange', () => {
              clearTimeout(timeout);
              resolve();
            }, { once: true });
          });
        }

        const controlResponse = await fetch('./controls-failsafe-v139.js?verify=' + Date.now(), { cache: 'no-store' });
        const controlCode = await controlResponse.text();
        if (!controlResponse.ok || !controlCode.includes('__WINAMP_MUSIC_CONTROLS_V139__')) {
          throw new Error('Native controls verification failed');
        }

        state.textContent = 'Controls 1.3.9 installed. Opening player…';
        openPlayer();
      } catch (error) {
        console.error(error);
        state.textContent = 'Automatic refresh was blocked. Tap once to open the player.';
        retry.hidden = false;
        retry.onclick = openPlayer;
      }
    })();
  </script>
</body>
</html>
