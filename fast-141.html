<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#17191f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Winamp Music Fast</title>
  <link rel="icon" href="./favicon.ico?v=141" sizes="any" />
  <link rel="stylesheet" href="./styles.css?v=141" />
  <style>
    html,body{touch-action:manipulation}
    body{overflow-x:hidden}
    .app-shell{position:relative;isolation:isolate}
    .topbar,.player,.library-panel,.controls,.controls button,.track-list,.track,.track-main,.search{position:relative;pointer-events:auto!important}
    .controls button,.track-main,.search{z-index:2;touch-action:manipulation;-webkit-tap-highlight-color:rgba(255,255,255,.16)}
    .fast-badge{display:inline-flex;align-items:center;min-height:30px;padding:0 10px;border:1px solid #35533c;border-radius:999px;background:#101711;color:#9df582;font:700 10px SFMono-Regular,Consolas,monospace;white-space:nowrap}
    #youtubePlayer{position:fixed!important;left:-10000px!important;top:-10000px!important;width:1px!important;height:1px!important;overflow:hidden!important;pointer-events:none!important;opacity:.001!important}
    .track-main{appearance:none;-webkit-appearance:none}
    .fast-note{margin:8px 0 0;text-align:center;color:#8f98a8;font-size:11px}
    @media(max-width:520px){.topbar{align-items:flex-start}.topbar>div:last-child{display:grid;justify-items:end}.player{border-radius:14px}.library-panel{border-radius:14px}.app-shell{padding-top:max(10px,env(safe-area-inset-top))}}
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">YOUR YOUTUBE. YOUR PLAYER.</div>
        <h1>WINAMP MUSIC</h1>
      </div>
      <div><span class="fast-badge">FAST 1.4.1</span></div>
    </header>

    <section class="player" aria-label="Player">
      <div class="screen">
        <div id="status" class="status">STARTING…</div>
        <div id="nowTitle" class="now-title">No track selected</div>
        <div id="nowArtist" class="now-artist">Loading saved library…</div>
        <div class="time-row">
          <span id="elapsed">00:00</span>
          <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek" />
          <span id="duration">00:00</span>
        </div>
      </div>

      <div class="controls">
        <button id="prevButton" type="button" aria-label="Previous">⏮</button>
        <button id="playButton" type="button" class="primary" aria-label="Play or pause">▶</button>
        <button id="nextButton" type="button" aria-label="Next">⏭</button>
        <button id="shuffleButton" type="button" aria-label="Shuffle">⤨</button>
      </div>

      <div class="volume-row">
        <span>VOL</span>
        <input id="volume" type="range" min="0" max="100" value="75" aria-label="Volume" />
      </div>
      <div id="youtubePlayer" aria-hidden="true"></div>
      <p class="fast-note">Controls are local and instant. YouTube loads separately.</p>
    </section>

    <section class="library-panel">
      <div class="library-header">
        <div><div class="eyebrow">PLAYLIST</div><h2>Your library <span id="trackCount">0</span></h2></div>
      </div>
      <input id="search" class="search" type="search" placeholder="Filter title or artist…" autocomplete="off" aria-label="Filter library" />
      <ol id="trackList" class="track-list"></ol>
      <div id="emptyState" class="empty-state" hidden>
        <strong>No saved music.</strong>
        <span>Open the normal importer later to add tracks.</span>
      </div>
    </section>

    <footer class="app-version">v1.4.1 fast</footer>
  </main>

  <script src="./fast-player-v141.js?v=141"></script>
</body>
</html>
