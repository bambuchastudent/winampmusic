<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#17191f" />
  <title>Repairing Winamp Music…</title>
  <style>
    html,body{height:100%;margin:0;background:#101216;color:#f6f6f6;font:16px system-ui,-apple-system,sans-serif}
    body{display:grid;place-items:center}.box{max-width:520px;padding:28px;text-align:center}.bolt{font-size:56px}.muted{color:#aeb4c0}button{font:inherit;padding:10px 16px;border-radius:10px;border:0;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <div class="box">
    <div class="bolt">⚡</div>
    <h1>Repairing Winamp Music</h1>
    <p id="state" class="muted">Removing the stale player cache. Your saved library stays intact.</p>
    <button id="retry" hidden>Open player</button>
  </div>
  <script>
    (async () => {
      const state = document.getElementById('state');
      const retry = document.getElementById('retry');
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.filter((reg) => reg.scope.includes('/winampmusic/')).map((reg) => reg.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.filter((key) => key.startsWith('winampmusic-shell-')).map((key) => caches.delete(key)));
        }
        state.textContent = 'Fixed. Opening the fresh player…';
        location.replace('./?recovered=135&t=' + Date.now());
      } catch (error) {
        console.error(error);
        state.textContent = 'Cache cleanup was blocked. Open the player once more.';
        retry.hidden = false;
        retry.onclick = () => location.replace('./?recovered=135&t=' + Date.now());
      }
    })();
  </script>
</body>
</html>
