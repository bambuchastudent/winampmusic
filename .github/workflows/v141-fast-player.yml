name: AmpMusic 1.5 release gate

on:
  pull_request:
    branches: [develop]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'sw.js'
      - 'fast-player-v141.js'
      - 'fast-release-v150.js'
      - 'fast-import-v150.js'
      - 'apple-music-import-v064.js'
      - 'apple-playlist-import-v150.js'
      - 'apple-match-strict-v150.js'
      - 'apple-album-import-v150.js'
      - 'apple-album-route-v150.js'
      - 'apple-no-ad-fallback-v150.js'
      - 'apple-music-config.js'
      - 'apple-musickit-v150.js'
      - 'apple-catalog-first-v150.js'
      - 'clean-playback-v150.js'
      - 'stable-v150.js'
      - 'fast-background-v150.js'
      - 'fast-actions-v143.js'
      - 'v059.js'
      - 'scripts/generate-apple-music-config.mjs'
      - 'scripts/run-node-tests.mjs'
      - 'tests/fast-player-v141.mjs'
      - 'tests/fast-import-v142.mjs'
      - 'tests/apple-playlist-v150.mjs'
      - 'tests/apple-album-source-v150.mjs'
      - 'tests/apple-musickit-in-player-v150.mjs'
      - 'tests/youtube-error2-v150.mjs'
      - 'tests/ui-polish-v150.mjs'
      - 'tests/real-tracks-radio-v150.mjs'
      - 'tests/fast-actions-v143.mjs'
      - 'tests/background-v150.mjs'
      - 'tests/stable-v150.mjs'
      - 'tests/mutation-v150.mjs'
      - 'tests/performance-v150.mjs'
      - 'tests/parallel-ci-runner-v169.mjs'
      - 'openspec/changes/release-v1.5.0/**'
      - 'openspec/changes/stabilize-v1.5/**'
      - 'openspec/changes/fix-youtube-error-2-v1.5/**'
      - 'openspec/changes/fix-search-metadata-ui-v1.5/**'
      - 'openspec/changes/restore-apple-playlist-v1.5/**'
      - 'openspec/changes/real-tracks-radio-v1.5/**'
      - 'openspec/changes/fix-apple-album-source-v1.5/**'
      - 'openspec/changes/apple-in-player-musickit-v1.5/**'
      - 'openspec/changes/parallel-ci-contracts-v1.6.9/**'
      - 'docs/OPTIMIZATION.md'
      - '.github/workflows/pages.yml'
      - '.github/workflows/v141-fast-player.yml'

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache npm test runtime
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-jsdom26

      - name: OpenSpec release contract
        run: |
          test -s openspec/changes/release-v1.5.0/proposal.md
          test -s openspec/changes/release-v1.5.0/design.md
          test -s openspec/changes/release-v1.5.0/tasks.md
          test -s openspec/changes/release-v1.5.0/specs/background-playback/spec.md
          test -s openspec/changes/release-v1.5.0/specs/share-routing/spec.md
          test -s openspec/changes/release-v1.5.0/specs/release-branding/spec.md
          test -s openspec/changes/release-v1.5.0/specs/v2-roadmap/spec.md
          test -s openspec/changes/stabilize-v1.5/proposal.md
          test -s openspec/changes/stabilize-v1.5/design.md
          test -s openspec/changes/stabilize-v1.5/tasks.md
          test -s openspec/changes/stabilize-v1.5/specs/v1.5-roadmap/spec.md
          test -s openspec/changes/fix-youtube-error-2-v1.5/proposal.md
          test -s openspec/changes/fix-youtube-error-2-v1.5/design.md
          test -s openspec/changes/fix-youtube-error-2-v1.5/tasks.md
          test -s openspec/changes/fix-youtube-error-2-v1.5/specs/playback-recovery/spec.md
          test -s openspec/changes/fix-search-metadata-ui-v1.5/proposal.md
          test -s openspec/changes/fix-search-metadata-ui-v1.5/design.md
          test -s openspec/changes/fix-search-metadata-ui-v1.5/tasks.md
          test -s openspec/changes/fix-search-metadata-ui-v1.5/specs/search-metadata-ui/spec.md
          test -s openspec/changes/restore-apple-playlist-v1.5/proposal.md
          test -s openspec/changes/restore-apple-playlist-v1.5/design.md
          test -s openspec/changes/restore-apple-playlist-v1.5/tasks.md
          test -s openspec/changes/restore-apple-playlist-v1.5/specs/apple-playlist-import/spec.md
          test -s openspec/changes/real-tracks-radio-v1.5/proposal.md
          test -s openspec/changes/real-tracks-radio-v1.5/design.md
          test -s openspec/changes/real-tracks-radio-v1.5/tasks.md
          test -s openspec/changes/real-tracks-radio-v1.5/specs/real-track-playback/spec.md
          test -s openspec/changes/fix-apple-album-source-v1.5/proposal.md
          test -s openspec/changes/fix-apple-album-source-v1.5/design.md
          test -s openspec/changes/fix-apple-album-source-v1.5/tasks.md
          test -s openspec/changes/fix-apple-album-source-v1.5/specs/apple-album-source/spec.md
          test -s openspec/changes/apple-in-player-musickit-v1.5/proposal.md
          test -s openspec/changes/apple-in-player-musickit-v1.5/design.md
          test -s openspec/changes/apple-in-player-musickit-v1.5/tasks.md
          test -s openspec/changes/apple-in-player-musickit-v1.5/specs/apple-in-player/spec.md
          test -s openspec/changes/parallel-ci-contracts-v1.6.9/proposal.md
          test -s openspec/changes/parallel-ci-contracts-v1.6.9/design.md
          test -s openspec/changes/parallel-ci-contracts-v1.6.9/specs/ci-runtime/spec.md
          test -s docs/OPTIMIZATION.md

      - name: Syntax check
        run: |
          node --check fast-player-v141.js
          node --check fast-release-v150.js
          node --check fast-import-v150.js
          node --check apple-music-import-v064.js
          node --check apple-playlist-import-v150.js
          node --check apple-match-strict-v150.js
          node --check apple-album-import-v150.js
          node --check apple-album-route-v150.js
          node --check apple-no-ad-fallback-v150.js
          node --check apple-music-config.js
          node --check apple-musickit-v150.js
          node --check apple-catalog-first-v150.js
          node --check clean-playback-v150.js
          node --check stable-v150.js
          node --check fast-background-v150.js
          node --check fast-actions-v143.js
          node --check v059.js
          node --check sw.js
          node --check scripts/generate-apple-music-config.mjs
          node --check scripts/run-node-tests.mjs
          node --check tests/parallel-ci-runner-v169.mjs

      - name: Install test runtime
        run: npm install --no-save --prefer-offline --no-audit --no-fund jsdom@26

      - name: Parallel runner contract
        run: node tests/parallel-ci-runner-v169.mjs

      - name: Functional contracts — 4 workers
        run: |
          node scripts/run-node-tests.mjs --jobs 4 \
            tests/stable-v150.mjs \
            tests/fast-player-v141.mjs \
            tests/apple-playlist-v150.mjs \
            tests/real-tracks-radio-v150.mjs \
            tests/apple-album-source-v150.mjs \
            tests/apple-musickit-in-player-v150.mjs \
            tests/youtube-error2-v150.mjs \
            tests/ui-polish-v150.mjs \
            tests/fast-import-v142.mjs \
            tests/fast-actions-v143.mjs \
            tests/background-v150.mjs

      - name: Mutation — critical regressions must be killed
        run: node tests/mutation-v150.mjs

      - name: Performance — startup budget
        run: node tests/performance-v150.mjs
