name: v0.6.4 Apple Music paste to play

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  verify-v064-apple-paste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check input-v056.js
          node --check apple-music-import-v064.js
          node --check sw.js
      - name: Verify paste to import to play wiring
        run: |
          grep -F "./apple-music-import-v064.js?v=0.6.4" input-v056.js
          grep -F "url.searchParams.get('i')" apple-music-import-v064.js
          grep -F "https://itunes.apple.com/lookup" apple-music-import-v064.js
          grep -F "url.searchParams.set('callback', callback)" apple-music-import-v064.js
          grep -F "url.searchParams.set('filter', 'videos')" apple-music-import-v064.js
          grep -F "const PIPED_APIS" apple-music-import-v064.js
          grep -F "const INVIDIOUS_APIS" apple-music-import-v064.js
          grep -F "window.importTracks?.([track])" apple-music-import-v064.js
          grep -F "setTimeout(() => window.playIndex?.(finalIndex), 0)" apple-music-import-v064.js
          grep -F "input.value = ''" apple-music-import-v064.js
          grep -Eq "const CACHE = 'winampmusic-shell-v(22|23|24|25)'" sw.js
          grep -F "'./apple-music-import-v064.js'" sw.js
