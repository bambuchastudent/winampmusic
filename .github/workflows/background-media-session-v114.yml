name: Background Media Session v1.14

on:
  pull_request:
    branches: [develop]
    paths:
      - 'background-media-session-v114.js'
      - 'background-playback-v114.js'
      - 'youtubejs-audio-first-v181.js'
      - 'youtube-embed-retry-v182.js'
      - 'relay/short-link/worker.js'
      - 'relay/youtubejs/worker.js'
      - 'relay/youtubejs/wrangler.toml'
      - 'youtubejs-relay-config.js'
      - 'scripts/generate-youtubejs-relay-config.mjs'
      - '.github/workflows/pages.yml'
      - 'fast-release-v150.js'
      - 'tests/background-media-session-v114.mjs'
      - 'tests/youtubejs-audio-first-v181.mjs'
      - 'tests/youtubejs-browser-audio-v183.mjs'
      - 'tests/youtubejs-only-v184.mjs'
      - 'tests/youtubejs-first-party-relay-v185.mjs'
      - 'tests/youtubejs-dedicated-relay-v186.mjs'
      - 'tests/youtube-embed-retry-v182.mjs'
      - 'openspec/changes/youtubejs-background-playback/**'
      - 'openspec/changes/youtubejs-browser-audio-v183/**'
      - 'openspec/changes/youtubejs-only-v184/**'
      - 'openspec/changes/youtubejs-first-party-relay-v185/**'
      - 'openspec/changes/youtubejs-dedicated-relay-v186/**'
      - 'openspec/changes/youtube-embed-retry-v182/**'
      - 'THIRD_PARTY_NOTICES.md'
      - 'LICENSE'
      - '.github/workflows/background-media-session-v114.yml'

jobs:
  media-session-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check background-media-session-v114.js
      - run: node --check background-playback-v114.js
      - run: node --check youtubejs-audio-first-v181.js
      - run: node --check youtube-embed-retry-v182.js
      - run: node --check relay/short-link/worker.js
      - run: node --check relay/youtubejs/worker.js
      - run: node --check scripts/generate-youtubejs-relay-config.mjs
      - run: node tests/background-media-session-v114.mjs
      - run: node tests/youtubejs-audio-first-v181.mjs
      - run: node tests/youtubejs-browser-audio-v183.mjs
      - run: node tests/youtubejs-only-v184.mjs
      - run: node tests/youtubejs-first-party-relay-v185.mjs
      - run: node tests/youtubejs-dedicated-relay-v186.mjs
      - run: node tests/youtube-embed-retry-v182.mjs
