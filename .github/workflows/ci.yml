name: Validate static app

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check youtube-import.js
          node --check winamp-features.js
          node --check sw.js
      - name: Check web manifest JSON
        run: python -m json.tool manifest.webmanifest >/dev/null
