name: Validate static app

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check youtube-import.js
          node --check paste-import.js
          node --check metadata-refresh.js
          node --check playlist-metadata.js
          node --check winamp-features.js
          node --check lyrics.js
          node --check comments.js
          node --check sw.js
      - name: Check playlist wiring
        run: |
          grep -q 'playlist-metadata.css' index.html
          grep -q 'metadata-refresh.js' index.html
          ! grep -q 'playlist-metadata.js' index.html
          grep -q 'track-duration' app.js
          grep -q 'track-youtube-labels' app.js
          grep -q 'Search title, artist, playlist, tag' index.html
          grep -q "startsWith('winampmusic-shell-')" app.js
      - name: Check visible v0.3.1 lyrics and comments wiring
        run: |
          grep -q 'v0.3.1' index.html
          grep -q 'id="lyricsBar"' index.html
          ! grep 'id="lyricsBar"' index.html | grep -q 'hidden'
          grep -q 'lyrics.js?v=0.3.1' index.html
          grep -q 'comments.js?v=0.3.1' index.html
          grep -q 'comments.css?v=0.3.1' index.html
          grep -q "commentThreads" comments.js
          grep -q "winampmusic.youtubeApiKey.v1" comments.js
          grep -q "winampmusic.lyrics.v2" lyrics.js
          grep -q "plainLyrics" lyrics.js
          grep -q "document.getElementById('commentsPanel')" comments.js
          grep -q "winampmusic-shell-v9" sw.js
          grep -q "comments.js" sw.js
          grep -q "lyrics.js" sw.js
      - name: Check web manifest JSON
        run: python -m json.tool manifest.webmanifest >/dev/null
