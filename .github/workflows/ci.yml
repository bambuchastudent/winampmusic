name: Validate static app

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check youtube-import.js
          node --check paste-import.js
          node --check youtube-context.js
          node --check direct-youtube-import.js
          node --check mobile-url-import.js
          node --check mobile-share.js
          node --check fixes-v054.js
          node --check metadata-refresh.js
          node --check compact-share.js
          node --check playlist-metadata.js
          node --check winamp-features.js
          node --check lyrics.js
          node --check lyrics-sync.js
          node --check comments.js
          node --check input-v056.js
          node --check v059.js
          node --check playback-continuity.js
          node --check sw.js
      - name: Check playlist wiring
        run: |
          grep -q 'playlist-metadata.css' index.html
          grep -q 'metadata-refresh.js' index.html
          grep -q 'compact-share.js?v=0.5' index.html
          grep -q 'youtube-context.js?v=0.5' index.html
          ! grep -q 'playlist-metadata.js' index.html
          grep -q 'track-duration' app.js
          grep -q 'track-youtube-labels' app.js
          grep -q 'Filter title, artist, playlist or tag' index.html
          grep -q "startsWith('winampmusic-shell-')" app.js
          grep -q 'www.pastepile.com/api/paste' compact-share.js
          grep -q 'www.pastepile.com/raw' compact-share.js
          grep -q 'text/plain;charset=UTF-8' compact-share.js
          grep -q 'AES-GCM' compact-share.js
          grep -q 'winampmusic.geniusMap.v1' compact-share.js
          grep -q 'winampmusic.player.v1' compact-share.js
          ! grep -q 'tracks.slice(currentIndex)' compact-share.js
          grep -q 'startTrackId: ids.includes(currentId)' compact-share.js
          grep -q 'window.playIndex' compact-share.js
          grep -q 'Short link ready' compact-share.js
          grep -q 'compact-share.js?v=0.5' metadata-refresh.js
      - name: Check YouTube source queue wiring
        run: |
          grep -q 'v0.5.5' index.html
          grep -q 'RD${parsed.videoId}' youtube-context.js
          grep -q 'playlistAddSelected' youtube-context.js
          grep -q 'moveContext(-1)' youtube-context.js
          grep -q 'moveContext(1)' youtube-context.js
          grep -q 'winampmusic.youtubeContext.v1' youtube-context.js
          grep -q 'YOUTUBE MIX' youtube-context.js
          grep -q 'direct-youtube-import.js?v=0.5.2' index.html
          grep -q "search.addEventListener('input'" direct-youtube-import.js
          grep -q 'winampMusicDirectYouTubeImport' direct-youtube-import.js
          grep -q 'window.importTracks' direct-youtube-import.js
          grep -q 'window.playIndex' direct-youtube-import.js
          grep -q 'RD${id}' direct-youtube-import.js
          grep -q 'winampMusicDirectYouTubeImport.handleUrl' mobile-url-import.js
          grep -q "params.get('s')" mobile-url-import.js
          grep -q "window.renderLibrary" mobile-url-import.js
          grep -q 'direct-youtube-import.js' sw.js
          grep -q 'mobile-url-import.js' sw.js
          grep -q 'youtube-context.js' sw.js
      - name: Check v0.5.5 large playlist import
        run: |
          grep -q 'fixes-v054.js?v=0.5.5' index.html
          grep -q 'MAX_PLAYLIST_SCAN_INDEX = 5000' fixes-v054.js
          grep -q 'PLAYLIST_SCAN_STEP = 100' fixes-v054.js
          grep -q 'player.cuePlaylist' fixes-v054.js
          grep -q 'PLAYLIST IMPORTED' fixes-v054.js
          grep -q 'refreshWinampMetadata' fixes-v054.js
          grep -q "let importingUrl = ''" fixes-v054.js
          ! grep -q 'lastHandledUrl' fixes-v054.js
          grep -q "search.value = ''" fixes-v054.js
          grep -q 'window.renderLibrary' fixes-v054.js
          grep -q 'fixes-v054.js' sw.js
          python - <<'PY'
          html = open('index.html', encoding='utf-8').read()
          assert html.index('fixes-v054.js') < html.index('paste-import.js')
          PY
      - name: Check Android share and fallback wiring
        run: |
          grep -q 'mobile.css?v=0.5.5' index.html
          grep -q 'mobile-share.js?v=0.5.3' index.html
          grep -q 'id="mobilePlaybackActions"' index.html
          grep -q 'id="mobileOpenYoutube"' index.html
          grep -q 'Share → Winamp Music' index.html
          grep -q 'winampMusicDirectYouTubeImport' mobile-share.js
          grep -q "params.get('url')" mobile-share.js
          grep -q "params.get('text')" mobile-share.js
          grep -q "\[101, 150\]" mobile-share.js
          grep -q 'YOUTUBE APP REQUIRED' mobile-share.js
          grep -q '"share_target"' manifest.webmanifest
          grep -q '"action": "./"' manifest.webmanifest
          grep -q 'mobile-share.js' sw.js
          grep -q 'mobile.css' sw.js
          grep -Eq 'winampmusic-shell-v(19|20)' sw.js
          grep -q 'empty-state\[hidden\]' mobile.css
      - name: Check v0.5.6 top import and playback continuity
        run: |
          grep -q 'input-v056.js?v=0.5.6' metadata-refresh.js
          grep -q 'playback-continuity.js?v=0.5.6' metadata-refresh.js
          grep -q 'youtube.com/feed/playlists' input-v056.js
          grep -q "insertFromPaste" input-v056.js
          grep -q 'winampmusic.playbackContinuity.v1' playback-continuity.js
          grep -q 'Resume from' playback-continuity.js
          grep -q 'input-v056.js' sw.js
          grep -q 'playback-continuity.js' sw.js
      - name: Check lyrics, mobile EQ and comments wiring
        run: |
          grep -q 'id="geniusEmbedHost"' index.html
          ! grep -q 'id="geniusUrlInput"' index.html
          ! grep -q 'Use Genius link' index.html
          grep -q 'aria-live="polite" hidden' index.html
          grep -q 'lyricsSyncHost .lyrics-line' fixes-v054.js
          grep -q 'panel.hidden = !(hasGenius || hasSynced)' fixes-v054.js
          grep -q '@media(pointer:coarse)' mobile.css
          grep -q 'eq-band input\[type="range"\].*pointer-events:none' mobile.css
          grep -q 'id="commentsPanel"' index.html
          grep -q 'id="commentsConnect"' index.html
          grep -q 'genius.com/api/search/multi' lyrics.js
          grep -q 'genius.com/songs/' lyrics.js
          grep -q 'winampmusic.geniusResults.v2' lyrics.js
          grep -q 'songMatchesTrack' lyrics.js
          grep -q 'lyrics-sync.js?v=0.6' comments.js
          grep -q 'lrclib.net/api/search' lyrics-sync.js
          grep -q 'winampmusic.syncedLyrics.v2' lyrics-sync.js
          grep -q 'payloadMatchesTrack' lyrics-sync.js
          grep -q 'SYNCED LYRICS · LRCLIB' lyrics-sync.js
          ! grep -q 'scrollIntoView' lyrics-sync.js
          grep -q 'centerLineInsideLyrics' lyrics-sync.js
          grep -q 'lyrics-line.active' captions.css
          grep -q 'lyrics-sync-label' captions.css
          grep -q 'Login with YouTube' comments.js
          grep -q '/api/v1/comments/' comments.js
          grep -q '/comments/' comments.js
          ! grep -q 'youtubeApiKey' comments.js
          ! grep -q 'initTokenClient' comments.js
          grep -q 'comments.js' sw.js
          grep -q 'lyrics.js' sw.js
          grep -q 'compact-share.js' sw.js
          grep -q 'fca600' icon.svg
          grep -q 'winamp-logo' metadata-refresh.js
          grep -q "icon.href = './icon.svg'" metadata-refresh.js
      - name: Check web manifest JSON
        run: python -m json.tool manifest.webmanifest >/dev/null
