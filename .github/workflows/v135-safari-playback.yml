name: v1.3.5 Safari playback recovery

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  safari-playback-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check app.js
          node --check boot-v134.js
          node --check sw-v135.js
      - name: Safari partial Media Session regression
        run: |
          npm install --no-save jsdom@26
          node tests/safari-playback-v135.mjs
      - name: Guard stale app-shell regression
        run: |
          grep -F "navigator.serviceWorker.register('./sw-v135.js')" boot-v134.js
          grep -F "event.respondWith(networkFirst(event.request))" sw-v135.js
          grep -F "navigator.serviceWorker.getRegistrations" recover.html
