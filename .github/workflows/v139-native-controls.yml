name: v1.3.9 native controls

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  native-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check controls-failsafe-v139.js
          node --check sw.js
      - name: Native click integration test
        run: |
          npm install --no-save jsdom@26
          node tests/native-controls-v139.mjs
