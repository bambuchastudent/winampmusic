name: Deploy ÁmpulaMP to Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm test runtime
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-jsdom26

      - name: Install test runtime
        run: npm install --no-save --prefer-offline --no-audit --no-fund jsdom@26

      - name: Parallel behavioral contracts — 4 workers
        run: |
          node scripts/run-node-tests.mjs --jobs 4 \
            --exclude tests/mutation-v150.mjs \
            --exclude tests/performance-v150.mjs \
            tests/*.mjs verify-*.mjs

      - name: Mutation — isolated
        run: node tests/mutation-v150.mjs

      - name: Performance — isolated
        run: node tests/performance-v150.mjs

  deploy:
    needs: verify
    outputs:
      revision: ${{ steps.revision.outputs.revision }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Apple Music MusicKit config
        env:
          APPLE_MUSIC_TEAM_ID: ${{ secrets.APPLE_MUSIC_TEAM_ID }}
          APPLE_MUSIC_KEY_ID: ${{ secrets.APPLE_MUSIC_KEY_ID }}
          APPLE_MUSIC_PRIVATE_KEY: ${{ secrets.APPLE_MUSIC_PRIVATE_KEY }}
          APPLE_MUSIC_ORIGIN: https://bambuchastudent.github.io
        run: node scripts/generate-apple-music-config.mjs apple-music-config.js

      - name: Detect optional Cloudflare relay credentials
        id: relay_gate
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            rate_salt="$(openssl rand -hex 32)"
            echo "::add-mask::$rate_salt"
            echo "RATE_SALT=$rate_salt" >> "$GITHUB_ENV"
            echo "Cloudflare credentials present; short-link relay deployment enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials absent; canonical Ámpula links remain active."
          fi

      - name: Deploy optional Ámpula short-link relay
        id: relay_deploy
        if: steps.relay_gate.outputs.enabled == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay/short-link
          wranglerVersion: "4.102.0"
          command: deploy
          secrets: |
            RATE_SALT
        env:
          RATE_SALT: ${{ env.RATE_SALT }}

      - name: Generate short-link runtime config
        id: relay_config
        env:
          RELAY_DEPLOYMENT_URL: ${{ steps.relay_deploy.outputs.deployment-url }}
          RELAY_COMMAND_OUTPUT: ${{ steps.relay_deploy.outputs.command-output }}
        run: node scripts/generate-short-link-config.mjs ampula-short-link-config.js

      - name: Verify optional short-link relay
        if: steps.relay_config.outputs.relay_url != ''
        env:
          RELAY_URL: ${{ steps.relay_config.outputs.relay_url }}
        run: |
          set -u
          if curl --fail --silent --show-error --retry 4 --retry-delay 2 "${RELAY_URL}healthz" >/dev/null; then
            echo "Ámpula short-link relay is healthy: $RELAY_URL"
          else
            echo "::warning::Short-link relay health check failed; publishing with canonical share fallback."
            RELAY_DEPLOYMENT_URL='' RELAY_COMMAND_OUTPUT='' node scripts/generate-short-link-config.mjs ampula-short-link-config.js
          fi

      - name: Stamp footer build revision
        id: revision
        env:
          TZ: Europe/Madrid
        run: |
          revision="r$(date +'%y%m%d%H%M')"
          node scripts/stamp-build-revision.mjs index.html "${revision#r}"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create revision tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ needs.deploy.outputs.revision }}
          PAGES_URL: https://bambuchastudent.github.io/winampmusic/
        run: |
          set -euo pipefail
          test -n "$REVISION"

          if gh release view "$REVISION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $REVISION already exists; nothing to do."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$REVISION" >/dev/null 2>&1; then
            echo "::error::Tag $REVISION already exists without a matching GitHub Release."
            exit 1
          fi

          pr_number="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '.[0].number // empty')"

          if [ -n "$pr_number" ]; then
            gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json number,title,body,url,headRefName > release-pr.json
          else
            title="$(git log -1 --pretty='%s')"
            body="$(git log -1 --pretty='%b')"
            jq -n \
              --arg title "$title" \
              --arg body "$body" \
              '{number:null,title:$title,body:$body,url:"",headRefName:""}' > release-pr.json
          fi

          node scripts/build-release-notes.mjs release-pr.json release-notes.md

          gh release create "$REVISION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ÁmpulaMP $REVISION" \
            --notes-file release-notes.md
