name: Deploy Winamp Music to Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test runtime
        run: npm install --no-save jsdom@26

      - name: Behavioral suite
        run: |
          status=0
          for test in tests/*.mjs; do
            echo "::group::$test"
            node "$test" || status=1
            echo "::endgroup::"
          done
          for contract in verify-*.mjs; do
            echo "::group::$contract"
            node "$contract" || status=1
            echo "::endgroup::"
          done
          exit $status

  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Apple Music MusicKit config
        env:
          APPLE_MUSIC_TEAM_ID: ${{ secrets.APPLE_MUSIC_TEAM_ID }}
          APPLE_MUSIC_KEY_ID: ${{ secrets.APPLE_MUSIC_KEY_ID }}
          APPLE_MUSIC_PRIVATE_KEY: ${{ secrets.APPLE_MUSIC_PRIVATE_KEY }}
          APPLE_MUSIC_ORIGIN: https://bambuchastudent.github.io
        run: node scripts/generate-apple-music-config.mjs apple-music-config.js

      - name: Detect optional Cloudflare relay credentials
        id: relay_gate
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            rate_salt="$(openssl rand -hex 32)"
            echo "::add-mask::$rate_salt"
            echo "RATE_SALT=$rate_salt" >> "$GITHUB_ENV"
            echo "Cloudflare credentials present; short-link relay deployment enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials absent; canonical Ámpula links remain active."
          fi

      - name: Deploy optional Ámpula short-link relay
        id: relay_deploy
        if: steps.relay_gate.outputs.enabled == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay/short-link
          wranglerVersion: "4.102.0"
          command: deploy
          secrets: |
            RATE_SALT
        env:
          RATE_SALT: ${{ env.RATE_SALT }}

      - name: Generate short-link runtime config
        id: relay_config
        env:
          RELAY_DEPLOYMENT_URL: ${{ steps.relay_deploy.outputs.deployment-url }}
          RELAY_COMMAND_OUTPUT: ${{ steps.relay_deploy.outputs.command-output }}
        run: node scripts/generate-short-link-config.mjs ampula-short-link-config.js

      - name: Verify optional short-link relay
        if: steps.relay_config.outputs.relay_url != ''
        env:
          RELAY_URL: ${{ steps.relay_config.outputs.relay_url }}
        run: |
          set -u
          if curl --fail --silent --show-error --retry 4 --retry-delay 2 "${RELAY_URL}healthz" >/dev/null; then
            echo "Ámpula short-link relay is healthy: $RELAY_URL"
          else
            echo "::warning::Short-link relay health check failed; publishing with canonical share fallback."
            RELAY_DEPLOYMENT_URL='' RELAY_COMMAND_OUTPUT='' node scripts/generate-short-link-config.mjs ampula-short-link-config.js
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
