name: Smoke short share backend

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/share-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Create and read anonymous Pastepile payload
        shell: bash
        run: |
          set -euo pipefail
          payload='{"winampmusic":"share-smoke","ok":true}'
          paste_url=$(curl --fail --silent --show-error \
            --data-binary "$payload" \
            -H 'Content-Type: text/plain;charset=UTF-8' \
            -H 'Accept: text/plain' \
            'https://www.pastepile.com/api/paste')
          slug="${paste_url##*/}"
          test -n "$slug"
          restored=$(curl --fail --silent --show-error \
            -H 'Accept: text/plain' \
            "https://www.pastepile.com/raw/${slug}")
          test "$restored" = "$payload"
          echo "Pastepile create/read smoke test passed for slug: $slug"
