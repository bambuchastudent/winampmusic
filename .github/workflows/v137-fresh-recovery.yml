name: v1.3.7 fresh recovery entrypoint

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  fresh-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify recovery is cache-independent and non-destructive
        run: |
          grep -q "recover-fresh-137.html" recover.html
          grep -q "sw.js?fresh=" recover-fresh-137.html
          grep -q "updateViaCache: 'none'" recover-fresh-137.html
          grep -q "cache: 'no-store'" recover-fresh-137.html
          grep -q "window.__WINAMP_MUSIC_RUNTIME__ = '1.3.6'" recover-fresh-137.html
          grep -q "location.replace(appUrl)" recover-fresh-137.html
          ! grep -q "localStorage.clear" recover-fresh-137.html
          ! grep -q "localStorage.removeItem" recover-fresh-137.html
