name: v0.5.9 song search and Safari favicon

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  verify-v059:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check v059.js
          node --check input-v056.js
          node --check sw.js
      - name: Verify persistent song search wiring
        run: |
          grep -F "window.importTracks?.([track])" v059.js
          grep -F "localStorage.getItem(STORAGE_KEY)" v059.js
          grep -F "/api/v1/search" v059.js
          grep -F "type', 'video" v059.js
          grep -F "./v059.js?v=0.5.9" input-v056.js
      - name: Verify Safari lightning icon wiring
        run: |
          grep -F "./icon.svg?v=0.5.9" v059.js
          grep -F "./safari-pinned-tab.svg?v=0.5.9" v059.js
          grep -Eq "winampmusic-shell-v(20|21|22|23)" sw.js
          grep -F "./v059.js" sw.js
          grep -F "./safari-pinned-tab.svg" sw.js
          grep -F "#fca600" icon.svg
          grep -F "fill=\"#000\"" safari-pinned-tab.svg
