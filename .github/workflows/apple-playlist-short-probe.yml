name: Apple playlist short probe

on:
  pull_request:
    branches: [develop]
    paths:
      - 'tests/apple-playlist-short-probe.mjs'
      - '.github/workflows/apple-playlist-short-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/apple-playlist-short-probe.mjs
