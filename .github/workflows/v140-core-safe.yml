name: v1.4.0 core safe

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  core-safe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check app.js
          node --check boot-v140.js
          node --check v059.js
          node --check sw.js
      - name: Real core interaction test
        run: |
          npm install --no-save jsdom@26
          node tests/core-v140.mjs
