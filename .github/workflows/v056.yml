name: Validate v0.5.6 fixes

on:
  pull_request:
    paths:
      - 'input-v056.js'
      - 'playback-continuity.js'
      - 'metadata-refresh.js'
      - 'sw.js'
      - '.github/workflows/v056.yml'

permissions:
  contents: read

jobs:
  validate-v056:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check input-v056.js
          node --check playback-continuity.js
          node --check metadata-refresh.js
          node --check sw.js
      - name: Check top music import bar
        run: |
          grep -q "addEventListener('paste'" input-v056.js
          grep -q "insertFromPaste" input-v056.js
          grep -q "addEventListener('beforeinput'" input-v056.js
          grep -Eq 'Paste (YouTube track or playlist URL|YouTube or Apple Music URL)' input-v056.js
          grep -q 'youtube.com/feed/playlists' input-v056.js
          grep -q 'winampMusicDirectYouTubeImport' input-v056.js
          grep -q "key: 'Enter'" input-v056.js
      - name: Check library filter stays separate
        run: |
          grep -q "importInput.id = 'youtubeImportInput'" input-v056.js
          grep -q 'Filter title, artist, playlist or tag' input-v056.js
          grep -q "search.setAttribute('aria-label', 'Filter library')" input-v056.js
          grep -q 'guardFilter' input-v056.js
          ! grep -q 'row.appendChild(search)' input-v056.js
      - name: Check playback continuity
        run: |
          grep -q 'winampmusic.playbackContinuity.v1' playback-continuity.js
          grep -q "addEventListener('pagehide'" playback-continuity.js
          grep -q "addEventListener('visibilitychange'" playback-continuity.js
          grep -q 'Resume from' playback-continuity.js
          grep -q 'window.playIndex' playback-continuity.js
      - name: Check production wiring
        run: |
          grep -q 'input-v056.js?v=0.5.6' metadata-refresh.js
          grep -q 'playback-continuity.js?v=0.5.6' metadata-refresh.js
          grep -Eq 'winampmusic-shell-v(19|20|21|22|23|24|25)' sw.js
          grep -q "'./input-v056.js'" sw.js
          grep -q "'./playback-continuity.js'" sw.js
