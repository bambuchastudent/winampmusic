name: v0.6.3 Apple Music import

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  verify-v063-apple-music:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check input-v056.js
          node --check apple-music-import-v063.js
          node --check sw.js
      - name: Verify Apple Music routing
        run: |
          grep -F "host !== 'music.apple.com'" input-v056.js
          grep -F "./apple-music-import-v063.js?v=0.6.3" input-v056.js
          grep -F 'MUSIC IMPORT' input-v056.js
          grep -F 'Paste YouTube or Apple Music' input-v056.js
          grep -F "https://api.song.link/v1-alpha.1/links" apple-music-import-v063.js
          grep -F 'links.youtubeMusic?.url || links.youtube?.url' apple-music-import-v063.js
          grep -F 'winampMusicDirectYouTubeImport?.handleUrl' apple-music-import-v063.js
          grep -F "form.id !== 'songSearchForm'" apple-music-import-v063.js
          grep -F "'./apple-music-import-v063.js'" sw.js
          grep -F "'apple-music-import-v063.js'" sw.js
