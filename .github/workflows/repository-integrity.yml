name: Repository integrity cleanup

on:
  pull_request:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache npm test runtime
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-jsdom26

      - name: Syntax check current runtime and integrity test
        run: |
          for file in \
            fast-player-v141.js \
            fast-release-v150.js \
            playback-continuity-v160.js \
            clean-playback-v150.js \
            apple-catalog-first-v150.js \
            apple-resolution-v162.js \
            apple-musickit-v150.js \
            unified-entry-v152.js \
            import-playback-guard-v159.js \
            header-visualizer-v159.js \
            fast-actions-v143.js \
            fast-import-v150.js \
            telegram-text-import-v1.js \
            apple-music-import-v064.js \
            apple-playlist-import-v150.js \
            apple-album-import-v150.js \
            fast-background-v150.js \
            origin-playback-v151.js \
            v059.js \
            compact-share.js \
            share-ui-cleanup-v162.js \
            legacy-share-v1.js \
            qr-share-v1.js \
            sw.js \
            scripts/run-node-tests.mjs \
            tests/repository-integrity-v1.mjs \
            tests/apple-full-resolution-v162.mjs \
            tests/legacy-share-recovery-v1.mjs \
            tests/fast-actions-v143.mjs \
            tests/share-ui-cleanup-v1.mjs \
            tests/local-playback-continuity-v160.mjs; do
            node --check "$file"
          done

      - name: Install targeted test runtime
        run: npm install --no-save --prefer-offline --no-audit --no-fund jsdom@26

      - name: Repository contracts — 4 workers
        run: |
          node scripts/run-node-tests.mjs --jobs 4 \
            tests/repository-integrity-v1.mjs \
            tests/local-playback-continuity-v160.mjs \
            tests/apple-full-resolution-v162.mjs \
            tests/legacy-share-recovery-v1.mjs \
            tests/fast-actions-v143.mjs \
            tests/share-ui-cleanup-v1.mjs \
            tests/ampula-sharing-v1.mjs \
            tests/now-playing-header-v159.mjs \
            tests/unified-music-entry.mjs \
            tests/unified-entry-polish-v153.mjs \
            verify-share-nonblocking-v158.mjs \
            verify-logo-fit-v158.mjs \
            verify-mobile-bottle-fit-v157.mjs \
            tests/apple-origin-playback-v151.mjs \
            tests/fast-import-v142.mjs \
            tests/telegram-text-import-v1.mjs
