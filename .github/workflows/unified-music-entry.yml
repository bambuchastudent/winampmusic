name: Unified music entry

on:
  pull_request:
    paths:
      - 'unified-entry-v152.js'
      - 'spotify-playlist-core-v160.js'
      - 'spotify-origin-import-v162.js'
      - 'origin-playback-v151.js'
      - 'stable-v150.js'
      - 'sw.js'
      - 'scripts/run-node-tests.mjs'
      - 'tests/unified-music-entry.mjs'
      - 'tests/spotify-playlist-source.mjs'
      - 'tests/spotify-origin-import-v162.mjs'
      - 'tests/spotify-import-fallback-v172.mjs'
      - 'tests/spotify-origin-playback-v162.mjs'
      - 'openspec/changes/unified-music-entry-v1.5/**'
      - 'openspec/changes/spotify-origin-youtube-fallback-v1.6.2/**'
      - 'openspec/changes/on-demand-resolve-prefetch-v1.6.5/**'
      - 'openspec/changes/spotify-import-fallback-v1.7.2/**'
      - '.github/workflows/unified-music-entry.yml'
  push:
    branches: [develop]
    paths:
      - 'unified-entry-v152.js'
      - 'spotify-playlist-core-v160.js'
      - 'spotify-origin-import-v162.js'
      - 'origin-playback-v151.js'
      - 'stable-v150.js'
      - 'sw.js'
      - 'scripts/run-node-tests.mjs'
      - 'tests/unified-music-entry.mjs'
      - 'tests/spotify-playlist-source.mjs'
      - 'tests/spotify-origin-import-v162.mjs'
      - 'tests/spotify-import-fallback-v172.mjs'
      - 'tests/spotify-origin-playback-v162.mjs'
      - 'openspec/changes/unified-music-entry-v1.5/**'
      - 'openspec/changes/spotify-origin-youtube-fallback-v1.6.2/**'
      - 'openspec/changes/on-demand-resolve-prefetch-v1.6.5/**'
      - 'openspec/changes/spotify-import-fallback-v1.7.2/**'
      - '.github/workflows/unified-music-entry.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache npm test runtime
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-jsdom26
      - name: Check adapter syntax
        run: |
          node --check unified-entry-v152.js
          node --check spotify-playlist-core-v160.js
          node --check spotify-origin-import-v162.js
          node --check origin-playback-v151.js
          node --check stable-v150.js
          node --check tests/spotify-import-fallback-v172.mjs
          node --check scripts/run-node-tests.mjs
      - name: Install targeted test runtime
        run: npm install --no-save --prefer-offline --no-audit --no-fund jsdom@26
      - name: Run behavioral contracts — 4 workers
        run: |
          node scripts/run-node-tests.mjs --jobs 4 \
            tests/unified-music-entry.mjs \
            tests/spotify-playlist-source.mjs \
            tests/spotify-origin-import-v162.mjs \
            tests/spotify-import-fallback-v172.mjs \
            tests/spotify-origin-playback-v162.mjs
      - name: Check metadata-only Spotify wiring
        run: |
          grep -q "'./spotify-origin-import-v162.js'" sw.js
          grep -q 'spotify-origin-import-v162.js?v=162' stable-v150.js
          grep -q 'spotify.xwolf.space/api/playlist/' spotify-origin-import-v162.js
          grep -q 'spotify.xwolf.space/api/token' spotify-origin-import-v162.js
          grep -q 'api.spotify.com/v1' spotify-origin-import-v162.js
          grep -q 'Origin ·' origin-playback-v151.js
          grep -q 'Spotify' origin-playback-v151.js
          ! grep -q "'./spotify-playlist-embed-v160.js'" sw.js
          ! grep -q "'./spotify-played-library-v161.js'" sw.js
          ! grep -q 'spotify-playlist-embed-v160.js' stable-v150.js
