name: v0.6.2 current track share and Safari favicon

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  verify-v062:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check input-v056.js
          node --check favicon-v060.js
          node --check share-current-v062.js
          node --check compact-share.js
          node --check sw.js
      - name: Verify current-track share wiring
        run: |
          grep -F './share-current-v062.js?v=0.6.2' input-v056.js
          grep -F 'shareCurrentTrackButton' share-current-v062.js
          grep -F 'createRemoteShare([track])' share-current-v062.js
          grep -F 'buildFallbackUrl?.([track.id])' share-current-v062.js
          grep -F "'./share-current-v062.js'" sw.js
      - name: Verify Safari raster favicon refresh
        run: |
          test -s favicon.ico
          test -s favicon-16.png
          test -s favicon-32.png
          python - <<'PY'
          from pathlib import Path
          data = Path('favicon.ico').read_bytes()
          assert data[:6] == b'\x00\x00\x01\x00\x02\x00', 'favicon.ico must be a 2-image ICO'
          assert Path('favicon-16.png').read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
          PY
          grep -F "const VERSION = '0.6.2'" favicon-v060.js
          grep -F './favicon-16.png?v=${VERSION}' favicon-v060.js
          grep -F "'./favicon-16.png'" sw.js
